name: Release

on:
  push:
    branches:
      - 'release/**'
      - 'release/*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 0.2.0)'
        required: true
        type: string

# 按分支/版本串行化：同一个版本同时被触发两次时，第二个排队等第一个跑完，
# 而不是两个任务同时往同一个 Draft 上传附件、互相覆盖正文。
#
# 刻意 **不** cancel-in-progress：发布任务跑到一半被取消会留下一个只有部分平台产物的
# Draft，比排队等待更糟。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 先创建草稿 Release，避免并发竞争
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.result }}
      version: ${{ steps.get_version.outputs.version }}
      release_notes: ${{ steps.release_notes.outputs.notes }}
      # 所有构建任务都必须 checkout 这个 SHA。分支在 workflow 运行期间可能又收到新提交，
      # 各任务各自解析分支名会拿到不同的树，产物之间以及产物与 tag 都会对不上。
      build_sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Get version from tauri.conf.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Read release notes
        id: release_notes
        run: |
          DEFAULT_NOTES="日常更新"
          if [ -f "RELEASE_NOTES.md" ]; then
            # 读取文件内容
            NOTES=$(cat RELEASE_NOTES.md)
            # 去除空白字符后检查是否为空
            TRIMMED=$(echo "$NOTES" | tr -d '[:space:]')
            if [ -z "$TRIMMED" ]; then
              # 文件为空，使用默认说明
              echo "notes=$DEFAULT_NOTES" >> $GITHUB_OUTPUT
            else
              # 文件有内容，使用 EOF 分隔符处理多行内容
              echo "notes<<EOF" >> $GITHUB_OUTPUT
              echo "$NOTES" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
            fi
          else
            # 文件不存在，使用默认说明
            echo "notes=$DEFAULT_NOTES" >> $GITHUB_OUTPUT
          fi

      - name: Create or Get Draft Release
        id: create_release
        uses: actions/github-script@v8
        env:
          RELEASE_NOTES: ${{ steps.release_notes.outputs.notes }}
        with:
          script: |
            const tagName = `v${{ steps.get_version.outputs.version }}`;
            const releaseNotes = process.env.RELEASE_NOTES || '日常更新';

            // 先检查是否已存在 release
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tagName
              });
              console.log(`Found existing release: ${release.id}`);
              // 如果存在且是草稿，更新 body 并返回
              if (release.draft) {
                await github.rest.repos.updateRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id,
                  target_commitish: context.sha,
                  body: releaseNotes
                });
                return release.id;
              }
              // 如果已发布，报错
              throw new Error(`Release ${tagName} already published. Please delete it first or use a different version.`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            // 不存在则创建新的草稿 release。
            // target_commitish 必须显式绑定到**本次 workflow 的 SHA**：
            // 不指定时 GitHub 会把 tag 打在默认分支 HEAD 上，而附件是从
            // release 分支的这个 commit 构建的 —— tag 源码与二进制对不上。
            const { data } = await github.rest.repos.createRelease({
              target_commitish: context.sha,
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              name: `CodeShelf ${tagName}`,
              body: releaseNotes,
              draft: true,
              prerelease: false
            });
            console.log(`Created new draft release: ${data.id}`);
            return data.id;

  # 构建各平台版本
  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            config: 'src-tauri/tauri.release.conf.json'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            config: 'src-tauri/tauri.release.conf.json'
          - platform: 'ubuntu-22.04'
            args: ''
            config: 'src-tauri/tauri.release.conf.json'
          - platform: 'windows-latest'
            args: ''
            config: 'src-tauri/tauri.release.conf.json --config src-tauri/tauri.windows.conf.json'

    runs-on: ${{ matrix.platform }}
    env:
      # 写进产物，安装后可核对「这个二进制到底是哪个 commit 构建的」
      CODESHELF_BUILD_SHA: ${{ needs.create-release.outputs.build_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.create-release.outputs.build_sha }}

      - name: Verify checkout matches release commit
        shell: bash
        run: |
          ACTUAL=$(git rev-parse HEAD)
          EXPECTED="${{ needs.create-release.outputs.build_sha }}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::checkout 的 commit ($ACTUAL) 与 Release 绑定的 commit ($EXPECTED) 不一致"
            exit 1
          fi
          echo "构建 commit: $ACTUAL"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          releaseBody: ${{ needs.create-release.outputs.release_notes }}
          updaterJsonKeepUniversal: true
          args: ${{ matrix.args }} --config ${{ matrix.config }}

      # Windows 便携版（绿色版）
      - name: Create portable version (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          $version = "${{ needs.create-release.outputs.version }}"
          $portableDir = "CodeShelf-Portable-v$version"
          $zipName = "CodeShelf-Portable-v$version-x64.zip"

          New-Item -ItemType Directory -Force -Path $portableDir
          Copy-Item "src-tauri/target/release/CodeShelf.exe" "$portableDir/"

          # sidecar 必须一起打包。Tauri 把 resources/sidecars/ 映射到安装目录的 sidecars/，
          # 便携版只复制 exe 的话，简历生成必然报「未找到内置 Node resume agent」。
          # 布局要与安装版一致：exe 旁边一个 sidecars/ 目录。
          $sidecarSrc = "src-tauri/resources/sidecars"
          if (-not (Test-Path "$sidecarSrc/node/node.exe") -or -not (Test-Path "$sidecarSrc/resume-agent/main.cjs")) {
            Write-Error "sidecar 产物缺失（$sidecarSrc），便携包会缺少简历生成功能，中止构建"
            exit 1
          }
          Copy-Item -Recurse "$sidecarSrc" "$portableDir/sidecars"

          Set-Content -Path "$portableDir/.portable" -Value "This is a portable version. Auto-update is disabled."
          Compress-Archive -Path "$portableDir/*" -DestinationPath $zipName

          # 打包后回查 ZIP 内容，确认 sidecar 真的进去了
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zipName))
          $names = $zip.Entries | ForEach-Object { $_.FullName }
          $zip.Dispose()
          foreach ($need in @("sidecars/node/node.exe", "sidecars/resume-agent/main.cjs")) {
            if (-not ($names -contains $need)) {
              Write-Error "便携包缺少 $need；实际条目: $($names -join ', ')"
              exit 1
            }
          }
          Write-Host "便携包已包含 sidecar（$($names.Count) 个条目）"

          echo "PORTABLE_ZIP=$zipName" >> $env:GITHUB_OUTPUT
        shell: pwsh
        id: portable

      - name: Upload portable version to release (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const zipFile = '${{ steps.portable.outputs.PORTABLE_ZIP }}';
            const releaseId = ${{ needs.create-release.outputs.release_id }};

            // 重跑幂等：ZIP 名固定（CodeShelf-Portable-vX-x64.zip），
            // 上一次已经传过时同名上传会 422 失败，逼人工去删 asset。
            // 先删掉同名旧 asset 再传 —— rerun 能直接跑完。
            const { data: existing } = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              per_page: 100
            });
            for (const asset of existing.filter(a => a.name === zipFile)) {
              console.log(`Deleting stale asset ${asset.name} (${asset.id})`);
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id
              });
            }

            console.log(`Uploading ${zipFile} to release ${releaseId}`);
            const { data } = await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              name: zipFile,
              data: fs.readFileSync(zipFile)
            });

            console.log(`Uploaded: ${data.browser_download_url}`);

  # 所有构建完成后**不自动发布**：Release 停在 Draft，由人工确认后点 Publish。
  #
  # 之前 workflow 在构建成功后直接 `draft: false`，而 docs/更新步骤说明.md 写的是
  # 「到 Releases 页面找到草稿，确认无误后 Publish release」—— 两边矛盾，
  # 实际行为是没有任何门禁就把更新推给了所有用户（发布即触发自动更新）。
  #
  # 统一选择「人工批准」：发布是对外且不可逆的动作，构建成功不等于可以发版
  # （还要人工核对产物、签名、release notes）。
  summarize-release:
    needs: [create-release, build]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Summarize draft release
        uses: actions/github-script@v8
        with:
          script: |
            const releaseId = ${{ needs.create-release.outputs.release_id }};
            const { data: release } = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId
            });

            const names = release.assets.map(a => a.name);
            const assets = release.assets.map(a => `- ${a.name} (${(a.size/1024/1024).toFixed(1)} MiB)`).join('\n');

            // 完整性检查：缺任一平台产物、签名或 latest.json 都不该被发布。
            // 只看「构建 job 全绿」不够 —— 上传本身可能失败，或某个矩阵被跳过。
            const required = [
              { label: 'Windows 安装包 (.msi/.exe)', test: n => /\.(msi|exe)$/i.test(n) },
              { label: 'Windows 便携包 (.zip)', test: n => /Portable.*\.zip$/i.test(n) },
              { label: 'macOS aarch64 (.dmg/.app.tar.gz)', test: n => /aarch64.*\.(dmg|tar\.gz)$/i.test(n) },
              { label: 'macOS x86_64 (.dmg/.app.tar.gz)', test: n => /x64|x86_64/i.test(n) && /\.(dmg|tar\.gz)$/i.test(n) },
              { label: 'Linux (.AppImage/.deb)', test: n => /\.(AppImage|deb)$/i.test(n) },
              { label: '更新签名 (.sig)', test: n => n.endsWith('.sig') },
              { label: '更新清单 latest.json', test: n => n === 'latest.json' },
            ];
            const missing = required.filter(r => !names.some(r.test)).map(r => r.label);
            const body = [
              `### Draft Release 已就绪：${release.tag_name}`,
              '',
              `- 构建 commit：\`${{ needs.create-release.outputs.build_sha }}\``,
              `- Release 绑定 commit：\`${release.target_commitish}\``,
              `- 状态：${release.draft ? 'Draft（等待人工发布）' : '已发布'}`,
              '',
              '**产物：**',
              assets || '（无）',
              '',
              '',
              missing.length
                ? `> **产物不完整，不要发布。** 缺少：\n>\n${missing.map(m => `> - ${m}`).join('\n')}`
                : '所有预期产物齐全。',
              '',
              `确认无误后到 [Release 页面](${release.html_url}) 点 **Publish release**。`,
              '在此之前用户不会收到自动更新。',
            ].join('\n');

            await core.summary.addRaw(body).write();
            console.log(body);

            if (!release.draft) {
              core.warning('Release 已经是发布状态 —— 按当前策略它本应停在 Draft 等待人工确认。');
            }

            // 产物不齐直接让这一步失败：Summary 里出现红叉，人不会误以为「全绿=可发布」
            if (missing.length) {
              core.setFailed(`Release 产物不完整，缺少：${missing.join('、')}。请勿发布，修复后 rerun。`);
            }

            // 构建 commit 与 Release 绑定 commit 必须一致（AUD-024 的自动核对）
            const buildSha = '${{ needs.create-release.outputs.build_sha }}';
            if (release.target_commitish !== buildSha) {
              core.setFailed(
                `tag 绑定的 commit (${release.target_commitish}) 与构建 commit (${buildSha}) 不一致，请勿发布。`
              );
            }
