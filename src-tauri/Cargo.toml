[package]
name = "codeshelf"
version = "0.1.49-1"
description = "代码书架 - 本地项目管理工具"
authors = ["tan"]
license = " Apache License 2.0"
repository = "https://github.com/en-o/codeshelf"
edition = "2021"
# 依赖里 cookie_store / time 都声明了 rust-version = 1.88.0，
# 之前这里写 1.77.2 是**假的**：按文档装 1.77 的干净环境根本编译不过。
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "codeshelf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["full", "time", "sync"] }
# 只为 ReaderStream：跨设备传输把中转文件流式回给客户端，不整份读进内存
tokio-util = { version = "0.7", features = ["io"] }
once_cell = "1.19"
chrono = "0.4"
dirs = "5"
cron = "0.12"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
thiserror = "2"
specta = { version = "=2.0.0-rc.22", features = ["serde_json"] }
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }

# 工具箱模块依赖
futures = "0.3"
reqwest = { version = "0.12", features = ["stream", "json", "cookies", "multipart"] }
url = "2.5"
# 网页抓取的「规则提取」：regex 已在依赖树（1.12）；kuchikiki 提供 CSS 选择器，
# 它本就被 wry/tauri-utils 引入并编译，这里精确复用同一版本，避免再编一份 html5ever。
regex = "1"
kuchikiki = "=0.8.8-speedreader"
urlencoding = "2.1"
axum = { version = "0.7", features = ["ws", "multipart"] }
tower-http = { version = "0.5", features = ["cors", "compression-gzip", "fs", "trace"] }
sysinfo = "0.30"
socket2 = "0.5"
mdns-sd = "0.20.1"
base64 = "0.22"
# 生成 MCP 网关访问密钥。getrandom 已经在依赖树里（ring / rustls 都在用），
# 这里只是把它提成直接依赖，不引入新的加密栈。
getrandom = "0.2"
# 本地服务的访问密码用它加盐哈希（russh 已经间接带着，不多下一个 crate）
sha2 = "0.10"
arboard = "3"
# 简历 docx 导出
docx-rs = "0.4"
# 显式禁用默认 aws-lc-rs 后端，改用 ring：项目内 reqwest/rustls 已经在用 ring，
# 这样 Windows 开发机不需要额外安装 NASM/CMake，CI 也少编一个加密栈。
russh = { version = "0.60", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-config = "0.58"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSColor", "NSWindow", "NSResponder", "NSEvent", "NSScreen", "NSGraphics"] }
objc2-foundation = { version = "0.3", features = ["NSThread"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    # 文件管理器右键菜单：写 HKCU 注册表（commands/shell_integration.rs）。
    # Win32_Security 是 RegCreateKeyExW 的 SECURITY_ATTRIBUTES 参数所需，少了它这个函数会被 cfg 掉。
    "Win32_System_Registry",
    "Win32_Security",
] }

# target/debug 曾经涨到 100GB，其中 deps 65GB、incremental 21GB —— 绝大部分是**依赖的调试信息**。
# 断点几乎只打在自己的代码里，依赖的 DWARF 纯属浪费磁盘。
[profile.dev]
debug = "line-tables-only" # 自己的代码保留行号（panic 回溯照常可读），去掉变量/类型的完整调试信息

[profile.dev.package."*"]
debug = false # 依赖不带调试信息 —— 体积大头在这里
